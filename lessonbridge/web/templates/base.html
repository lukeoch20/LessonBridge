<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LessonBridge{% endblock %}</title>
<style>
:root{--ink:#1f2933;--muted:#616e7c;--line:#d9e2ec;--accent:#0b7285;--warn:#b35c00;--ok:#2b8a3e;--bg:#f8fafc;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header a{color:var(--accent);text-decoration:none;font-weight:600}header .brand{font-size:18px;color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:#e3f2fd;color:#0b4f6c}.badge.sub{background:#fff3e0;color:var(--warn)}.badge.ok{background:#e6f4ea;color:var(--ok)}.badge.warn{background:#fff3e0;color:var(--warn)}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#eef2f6;color:var(--ink)}button.danger{background:#c92a2a}
form.inline{display:inline}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}textarea{width:100%;min-height:260px;font-family:ui-monospace,monospace;font-size:13px}
.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.err{color:#c92a2a}.small{font-size:12px}details{margin-top:4px}
.doc h1{font-size:22px}.doc h2{font-size:17px;margin-top:22px}.doc table{margin:8px 0}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">LessonBridge</a>
  <a href="/">Dashboard</a>
  <a href="/absences/new">Report absence</a>
  <a href="/rules">Rules</a>
  <a href="/events">School calendar</a>
  <a href="/documents">Documents</a>
  <a href="/onboard">Onboard</a>
  <a href="/teachers">Teachers</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
