[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonbridge"
version = "0.1.0"
description = "AI-assisted instructional continuity tool for teachers: calendars, substitute plans, absence reconciliation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
lessonbridge = "lessonbridge.cli:app"

[tool.setuptools.packages.find]
include = ["lessonbridge*"]

[tool.setuptools.package-data]
"lessonbridge.providers" = ["snapshots/*.json"]
"lessonbridge.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
